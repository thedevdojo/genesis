version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Pint 1.28 adds rules that flag existing files, and 1.30.5+ needs PHP 8.3
      - dependency-name: laravel/pint
        versions: ['>=1.28.0']
    groups:
      composer:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
